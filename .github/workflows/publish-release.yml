name: Build and publish NuGet package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages and create a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.MajorMinorPatch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Determine version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v4.7.0

      - name: Restore
        run: dotnet restore Sources/Render.NET.sln

      - name: Build
        run: dotnet build Sources/Render.NET.sln --configuration Release --no-restore -p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}

      - name: Test
        run: dotnet test Sources/Render.NET.sln --configuration Release --no-build --no-restore

      - name: Check Python development tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m black --check .github/scripts Benchmarks/compare.py Tests/Fixtures
          python3 -m isort --check-only --profile black .github/scripts Benchmarks/compare.py Tests/Fixtures
          python3 -m mypy --strict .github/scripts
          python3 -m mypy --strict Benchmarks/compare.py Tests/Fixtures/Jpeg2000
          python3 -m mypy --strict Tests/Fixtures/Jbig2
          python3 -m mypy --strict Tests/Fixtures/Tgs
          python3 -m mypy --strict Tests/Fixtures/Pdf
          python3 -m mypy --strict Tests/Fixtures/Svg/Png

      - name: Test release notes generation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Pack
        run: dotnet pack Sources/Render.NET.sln --configuration Release --no-build --output artifacts/packages -p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}

      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.MajorMinorPatch }}
        run: python3 .github/scripts/release_notes.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --packages artifacts/packages --output artifacts/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: artifacts/release-notes.md
          if-no-files-found: error

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: packages

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: bvd

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'packages/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: gh release create "$RELEASE_VERSION" packages/*.nupkg packages/*.snupkg --target "$RELEASE_COMMIT" --title "Render.NET $RELEASE_VERSION" --notes-file release/release-notes.md
